name: Validate and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Static consistency checks
        run: python tools/lint.py
      - name: Release/layout unit tests
        run: python -m unittest discover -s tests/unit -v
      - name: Build installable datapack
        run: python tools/build.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: modalith-datapack
          path: artifacts/*
          if-no-files-found: error
